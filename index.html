<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Message Sender</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Design tokens - Color System */
        :root {
            /* Primary Colors */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            
            /* Accent Color */
            --accent: #10b981;
            
            /* Neutrals */
            --neutral-50: #f9fafb;
            --neutral-100: #f3f4f6;
            --neutral-200: #e5e7eb;
            --neutral-300: #d1d5db;
            --neutral-700: #374151;
            --neutral-900: #111827;
            
            /* Semantic Colors */
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            
            /* Spacing */
            --radius: 12px;
        }

        /* Light mode (default) */
        :root.light {
            --bg: var(--neutral-50);
            --bg-secondary: var(--neutral-100);
            --bg-tertiary: white;
            --text: var(--neutral-900);
            --text-secondary: var(--neutral-700);
            --border: var(--neutral-200);
        }

        /* Dark mode */
        :root.dark {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #475569;
        }

        /* Body styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            animation: slideUp 0.5s ease-out;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            gap: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Theme toggle */
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--primary);
            border: none;
            color: white;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* Form group */
        .form-group {
            margin-bottom: 28px;
            animation: fadeIn 0.5s ease-out;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        /* Label */
        label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Input and textarea */
        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            transition: all 0.2s ease;
            resize: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: var(--bg-tertiary);
        }

        /* Textarea specific */
        textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        /* Input group */
        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
        }

        /* Copy button */
        .copy-btn {
            padding: 12px 14px;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        /* Character counter */
        .char-counter {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            text-align: right;
        }

        /* Button group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 36px;
            animation: fadeIn 0.5s ease-out 0.4s both;
        }

        /* Button base */
        button:not(.theme-toggle):not(.copy-btn) {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Send button */
        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            flex: 2;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Clear button */
        .clear-btn {
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.08);
            border-color: var(--error);
            color: var(--error);
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status */
        .status {
            margin-top: 24px;
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            text-align: center;
            font-weight: 500;
            animation: slideDown 0.3s ease-out;
            display: none;
            border: 1.5px solid;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.08);
            border-color: var(--success);
            color: var(--success);
        }

        .status.error {
            background: rgba(239, 68, 68, 0.08);
            border-color: var(--error);
            color: var(--error);
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 28px 24px;
                border-radius: 16px;
            }

            .title {
                font-size: 20px;
            }

            .subtitle {
                font-size: 11px;
            }

            button:not(.theme-toggle):not(.copy-btn) {
                padding: 11px 16px;
                font-size: 13px;
            }

            .button-group {
                gap: 10px;
                margin-top: 28px;
            }

            .header {
                margin-bottom: 28px;
            }

            .form-group {
                margin-bottom: 20px;
            }
        }

        /* Copied feedback */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .copy-btn.copied {
            animation: pulse 0.3s ease;
        }

        /* Dark mode smooth transitions */
        html, body, .container, input, textarea, button {
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">✈️</div>
                <div>
                    <div class="title">Telegram Bot</div>
                    <div class="subtitle">Message Sender</div>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
        </div>

        <!-- Form -->
        <form id="botForm">
            <!-- Bot Token -->
            <div class="form-group">
                <label for="token">Bot Token</label>
                <input
                    type="password"
                    id="token"
                    placeholder="Enter your Telegram bot token..."
                    required
                    autocomplete="off"
                >
            </div>

            <!-- Chat ID -->
            <div class="form-group">
                <label for="chatId">Chat ID</label>
                <div class="input-group">
                    <input
                        type="text"
                        id="chatId"
                        placeholder="Enter recipient Chat ID..."
                        required
                    >
                    <button type="button" class="copy-btn" id="copyBtn" title="Copy Chat ID">📋</button>
                </div>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    placeholder="Type your message here..."
                    required
                ></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span> characters
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="send-btn" id="sendBtn">Send Message</button>
                <button type="button" class="clear-btn" id="clearBtn">Clear</button>
            </div>
        </form>

        <!-- Status -->
        <div class="status" id="status"></div>
    </div>

    <script>
        // ============================================
        // DOM Elements
        // ============================================
        const tokenInput = document.getElementById('token');
        const chatIdInput = document.getElementById('chatId');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const statusDiv = document.getElementById('status');
        const charCount = document.getElementById('charCount');
        const themeToggle = document.getElementById('themeToggle');
        const form = document.getElementById('botForm');
        const html = document.documentElement;

        // ============================================
        // Storage Keys
        // ============================================
        const STORAGE_KEYS = {
            TOKEN: 'telegram_bot_token',
            CHAT_ID: 'telegram_chat_id',
            THEME: 'theme_preference'
        };

        // ============================================
        // Initialize on load
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            initializeTheme();
            setupEventListeners();
        });

        // ============================================
        // Load saved data
        // ============================================
        function loadSavedData() {
            const savedToken = localStorage.getItem(STORAGE_KEYS.TOKEN);
            const savedChatId = localStorage.getItem(STORAGE_KEYS.CHAT_ID);

            if (savedToken) tokenInput.value = savedToken;
            if (savedChatId) chatIdInput.value = savedChatId;
        }

        // ============================================
        // Theme management
        // ============================================
        function initializeTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME) || 'light';
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            if (theme === 'dark') {
                html.classList.add('dark');
                html.classList.remove('light');
                themeToggle.textContent = '☀️';
            } else {
                html.classList.add('light');
                html.classList.remove('dark');
                themeToggle.textContent = '🌙';
            }
            localStorage.setItem(STORAGE_KEYS.THEME, theme);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.classList.contains('dark') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        // ============================================
        // Event listeners setup
        // ============================================
        function setupEventListeners() {
            form.addEventListener('submit', handleSendMessage);
            clearBtn.addEventListener('click', handleClear);
            copyBtn.addEventListener('click', handleCopyId);
            messageInput.addEventListener('input', updateCharCounter);
            messageInput.addEventListener('input', autoResizeTextarea);
            messageInput.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter' && !e.nativeEvent.isComposing) {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            tokenInput.addEventListener('blur', () => {
                localStorage.setItem(STORAGE_KEYS.TOKEN, tokenInput.value);
            });

            chatIdInput.addEventListener('blur', () => {
                localStorage.setItem(STORAGE_KEYS.CHAT_ID, chatIdInput.value);
            });
        }

        // ============================================
        // Update character counter
        // ============================================
        function updateCharCounter() {
            charCount.textContent = messageInput.value.length;
        }

        // ============================================
        // Auto-resize textarea
        // ============================================
        function autoResizeTextarea() {
            messageInput.style.height = 'auto';
            messageInput.style.height = (messageInput.scrollHeight) + 'px';
        }

        // ============================================
        // Validate inputs
        // ============================================
        function validateInputs() {
            const token = tokenInput.value.trim();
            const chatId = chatIdInput.value.trim();
            const message = messageInput.value.trim();

            if (!token) {
                showStatus('Bot token is required', 'error');
                return false;
            }

            if (!chatId) {
                showStatus('Chat ID is required', 'error');
                return false;
            }

            if (!message) {
                showStatus('Message is required', 'error');
                return false;
            }

            return true;
        }

        // ============================================
        // Handle send message
        // ============================================
        async function handleSendMessage(e) {
            e.preventDefault();

            if (!validateInputs()) return;

            const token = tokenInput.value.trim();
            const chatId = chatIdInput.value.trim();
            const message = messageInput.value.trim();

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="spinner"></span> Sending...';

            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${token}/sendMessage`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message
                        })
                    }
                );

                const data = await response.json();

                if (data.ok) {
                    showStatus('✅ Message sent successfully!', 'success');
                    messageInput.value = '';
                    charCount.textContent = '0';
                    messageInput.style.height = 'auto';
                } else {
                    showStatus(data.description || 'Failed to send message', 'error');
                }
            } catch (error) {
                showStatus('Network error: ' + error.message, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Message';
            }
        }

        // ============================================
        // Handle clear
        // ============================================
        function handleClear() {
            messageInput.value = '';
            charCount.textContent = '0';
            messageInput.style.height = 'auto';
            statusDiv.classList.remove('show');
        }

        // ============================================
        // Handle copy chat ID
        // ============================================
        function handleCopyId() {
            const chatId = chatIdInput.value.trim();

            if (!chatId) {
                showStatus('Enter a Chat ID first', 'error');
                return;
            }

            navigator.clipboard.writeText(chatId).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.textContent = '✓';
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.textContent = '📋';
                }, 2000);
            }).catch(() => {
                showStatus('Failed to copy', 'error');
            });
        }

        // ============================================
        // Show status message
        // ============================================
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status show ${type}`;

            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
